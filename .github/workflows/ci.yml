name: Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  repository_dispatch:
    types: [new-release]
  workflow_dispatch:

permissions:
  contents: read

# Serialize the entire public build/deploy sequence, including source selection.
# A language release must not race a website release or cancel its deployment.
concurrency:
  group: website-${{ (github.event_name == 'release' || github.event_name == 'repository_dispatch') && 'public' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  # Preview-only until the public migration is explicitly enabled.
  PUBLIC_ENABLED: ${{ vars.CLOUDFLARE_PUBLIC_ENABLED == 'true' }}
  PUBLIC_PROJECT: ${{ vars.CLOUDFLARE_PUBLIC_PROJECT || 'toit' }}
  PREVIEW_PROJECT: ${{ vars.CLOUDFLARE_PREVIEW_PROJECT || 'toit-dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.source.outputs.target }}
      project: ${{ steps.source.outputs.project }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: automation

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Select website source and deployment target
        id: source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node automation/tool/select-deployment.mjs

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.ref }}
          path: site

      - name: Record the actual website source commit
        id: commit
        working-directory: site
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Keep the existing SvelteKit build on its supported Node version.
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: npm ci

      - name: Check source and release rendering
        working-directory: site
        run: |
          npm run check
          npm test
          npx eslint src tool tests --ext .js,.ts,.svelte,.mjs
          npx prettier --check 'src/**/*.{svelte,ts,js,css}' 'tool/*.mjs' 'tests/*.mjs'

      - name: Fetch current language release notes
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run releases:fetch

      - name: Build static website
        working-directory: site
        run: npm run build

      - name: Verify static pages and schema
        working-directory: site
        run: node tool/check-build.mjs

      - name: Install test browser
        working-directory: site
        run: npx cypress install

      - name: Check navigation and mobile layout in the browser
        uses: cypress-io/github-action@v7
        with:
          working-directory: site
          install: false
          start: npm run preview -- --host 127.0.0.1 --port 3000
          wait-on: http://localhost:3000
          browser: chrome

      - name: Prevent preview indexing
        if: steps.source.outputs.target == 'preview'
        working-directory: site
        run: node tool/prepare-preview.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: website
          path: site/build
          if-no-files-found: error

  deploy:
    needs: build
    if: needs.build.outputs.target != 'none'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build.outputs.target == 'public' && 'production' || 'preview' }}
      url: ${{ needs.build.outputs.target == 'preview' && 'https://www-dev.toitlang.org' || '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: website
          path: build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=${{ needs.build.outputs.project }} --branch=${{ needs.build.outputs.target == 'public' && 'production' || 'main' }} --commit-hash=${{ needs.build.outputs.sha }}
